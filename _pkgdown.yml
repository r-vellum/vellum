reference:
- title: Building & rendering scenes
  desc: >
    Build a scene functionally with `vl_scene()` and a pipeline of
    `push()` / `draw()` / `pop()`, then render it. `render()` picks the
    backend (PNG / SVG / PDF) from the file extension.
  contents:
  - vl_scene
  - describe
  - display
  - scene_raster
  - scene_svg
  - scene_png
  - as_vellum_scene
  - vl_render_animation

- title: Graphical objects (grobs)
  desc: >
    The drawable primitives. Most are vectorised and batch internally.
  contents:
  - grob
  - vl_arrow
  - stroke_to_path

- title: Units, viewports & layout
  desc: >
    Coordinate systems, nested viewports with scales, clipping and
    rotation, and the row/column layout solver.
  contents:
  - vl_unit
  - vl_convert
  - vl_viewport
  - grobwidth
  - why_size

- title: Inspecting a scene
  desc: >
    Static analysis, coverage statistics, and render profiling — all reading the
    resolved geometry the renderer draws with.
  contents:
  - vl_lint
  - vl_lint_rule
  - vl_lint_finding
  - scene_stats
  - profile_render
  - as_scene_spec
  - scene_write
  - scene_hash
  - scene_diff
  - scene_inset

- title: Paint & appearance
  desc: >
    The paint model shared across all backends: gradients, tiling
    patterns, masks, reusable styles, and hand-drawn rendering.
  contents:
  - vl_gpar
  - style
  - gradients
  - vl_pattern
  - vl_hatch
  - as_mask
  - vl_shadow
  - sketch

- title: Text
  desc: >
    Device-independent shaping and measurement, Markdown-style rich labels, and
    layout: text wrapped to a box or set along a curve.
  contents:
  - vl_strwidth
  - md
  - text_path_grob

- title: Placement
  desc: >
    Geometry services over a scene's resolved boxes: move labels apart, find the
    emptiest region, outline and buffer a group.
  contents:
  - vl_place
  - vl_empty_region
  - vl_hull
  - vl_buffer

- title: Geometry operations
  desc: >
    Producing paths: boolean combinations, contours from a grid, and SVG path
    data imported as real vector geometry.
  contents:
  - vl_path_op
  - vl_contour
  - vl_svg_path

- title: Output reach
  desc: >
    Destinations for a finished scene beyond a single file: a multi-page
    document, and a batch rendered across cores.
  contents:
  - pdf_pages
  - render_all

- title: Accessibility & fonts
  desc: >
    Tagged PDF output from the per-mark metadata channel, and a check on the one
    part of the determinism claim vellum does not control.
  contents:
  - scene_fonts
  - font_pin

- title: Big data
  desc: >
    Aggregate-then-shade rendering for large point clouds, dense timeseries, and
    network edges.
  contents:
  - datashade
  - datashade_lines
  - spread
  - dynspread

- title: Querying & editing scenes
  desc: >
    A solved scene reports its geometry: a per-element model with data keys and
    device-pixel boxes, picking by point, and editing by node name.
  contents:
  - node_names
  - hit_test
  - scene_model
  - vl_nearest
  - element_geometry

- title: Grid & ggplot2 interop
  desc: >
    Render an existing grid grob tree — including ggplot2 and lattice —
    through the vellum backend.
  contents:
  - as_vellum

- title: Caches & diagnostics
  contents:
  - vl_clear_render_cache

- title: Package
  contents:
  - vellum-package

footer:
  structure:
    left: developed_by
    right: built_with
